require:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  NewCops: enable
  Exclude:
    - 'bin/**/*'
    - 'config/**/*'
    - 'db/**/*'
    - 'spec/rails_helper.rb'
    - 'spec/spec_helper.rb'
    - 'vendor/**/*'

Style/AsciiComments:
  Enabled: false

Style/EmptyMethod:
  EnforcedStyle: expanded

Metrics/MethodLength:
  Max: 15

Metrics/ClassLength:
  Max: 200

# RSpec: 1つのitブロック内のアサーション（expect）の数制限を無効化
RSpec/MultipleExpectations:
  Enabled: false

Layout/TrailingWhitespace:
  Enabled: true

Layout/TrailingEmptyLines:
  Enabled: true

Layout/EmptyLines:
  Enabled: true

Layout/ExtraSpacing:
  Enabled: true
